
- name: disable default nginx
  ansible.builtin.service:
    name: nginx
    state: stopped
    enabled: false
  
- name: install nginx
  ansible.builtin.dnf:
    name: nginx
    state: enabled


- name: enable nginx 1.24 module
  ansible.builtin.dnf:
    name: nginx
    state: enabled
    version: 1.24
    

- name: start nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
