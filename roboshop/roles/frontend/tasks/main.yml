
- name: disable default nginx
  ansible.builtin.service:
    name: nginx
    state: stopped
    enabled: false

- name: enable nginx module stream
  ansible.builtin.dnf_module:
    name: nginx
    stream: 1.24
    state: enabled
    become: true

- name: install nginx
  ansible.builtin.dnf:
    name: nginx
    state: present

- name: start nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: yes

- name: configure hostname
  ansible.builtin.hostname:
    name: "{{ component }}-{{ env }}"
  become: true
