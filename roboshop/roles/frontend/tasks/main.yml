
- name: disable default nginx
  ansible.builtin.service:
    name: nginx
    state: stopped
    enabled: false
    
- name: Enable nginx module stream
  ansible.builtin.command: dnf module enable nginx:1.24 -y

- name: Install nginx
  ansible.builtin.dnf:
    name: nginx
    state: present
    
     
- name: install nginx
  ansible.builtin.dnf:
    name: nginx
    state: present

- name: start nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: yes
