
 -name : disable default nginx
  ansible.builtin.service:
    name: nginx
    state: disabled

- name: enable nginx 1.24 module
  ansible.builtin.dnf:
    name: nginx
    state: enabled
    module_enabled:
      - nginx:1.24


- name: install nginx
  ansible.builtin.dnf:
    name: nginx
    state: enabled

- name: start nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
