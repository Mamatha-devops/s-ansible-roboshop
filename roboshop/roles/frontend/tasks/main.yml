- name: disable the default nginx module
  ansible.builtin.dnf_module:
    name: nginx
    state: disabled

- name: enable nginx 1.24 module
  ansible.builtin.dnf_module:
    name: nginx:1.24
    state: enabled

- name: install nginx
  ansible.builtin.package:
    name: nginx
    state: present

- name: start nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
